# 单容器部署（host 网络，对外仅 58115）：
#   cd ~/services/acg-theogony && docker compose up -d --build
# FastAPI 与 Next 同容器运行，API 只绑 127.0.0.1:8000（容器回环），无独立容器/端口。
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - API_ORIGIN=http://127.0.0.1:18000
    image: acg-theogony:web
    container_name: acg-theogony-web
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=${WEB_PORT:-58115}
      - API_INTERNAL_PORT=18000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - LUNA_API_KEY=${LUNA_API_KEY:-}
      - LUNA_API_BASE=${LUNA_API_BASE:-}
      - LUNA_MODEL=${LUNA_MODEL:-gpt-5.6-luna}
      - LUNA_EXTRA_BODY=${LUNA_EXTRA_BODY:-{}}
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY:-}
      - EMBEDDINGS_API_BASE=${EMBEDDINGS_API_BASE:-}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-}
      - REVIEW_TOKEN=${REVIEW_TOKEN:-}
    volumes:
      - ./data:/repo/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:58115/api/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
